<!doctype html><meta charset="utf-8"><title>Xmas After Dark</title>
<style>body{margin:0}canvas{display:block}</style>
<canvas width="720" height="900"></canvas>
<script>
const view=document.querySelector('canvas').getContext('2d');
const art=new Image();
art.src=window.cookieArtwork;
const base=document.createElement('canvas');
base.width=720;
base.height=900;
const clean=base.getContext('2d',{willReadFrequently:true});
const chrome=document.createElement('canvas');
chrome.width=720;
chrome.height=900;
const design=window.design;
const titleAreas=design.title;
const details=design.details;
const [focusX,focusY]=design.focus;
const colors=design.palette;
const config=window.invitation;
const eventCopy=['DEC 23 · 9 PM','THE VELVET ROOM','RSVP BY DEC 20'];
let fitted;
function font(index,size){
  return index===1 || index===2 ? 'italic '+size+'px Georgia, "Songti SC", serif'
    : '500 '+size+'px Arial, "PingFang SC", sans-serif';
}
function fitCopy(){
  return config.copy.map((copy,index)=>{
    if(!copy) return null;
    const [x,y,width,maximum]=design.boxes[index];
    let size=Math.round(maximum);
    view.font=font(index,size);
    while(view.measureText(copy).width>width && size>16) view.font=font(index,--size);
    if(view.measureText(copy).width>width) throw Error('Text does not fit: '+copy);
    return {text:copy,x,y,size,font:font(index,size)};
  });
}
function drawCopy(index,time,start){
  const field=fitted[index];
  if(!field) return;
  const p=ease(time,start,start+.53);
  if(!p) return;
  const isTitle=index===1 || index===2;
  view.save();
  view.globalAlpha=p;
  view.translate(field.x,field.y+10*(1-p));
  view.scale(isTitle ? .63+.37*p : 1,isTitle ? .63+.37*p : 1);
  view.font=field.font;
  view.textAlign='center';
  view.textBaseline='alphabetic';
  if(isTitle){
    const chromeInk=view.createLinearGradient(0,-field.size,0,4);
    chromeInk.addColorStop(0,'#abb2d2');
    chromeInk.addColorStop(.41,'#fffaff');
    chromeInk.addColorStop(.52,'#706887');
    chromeInk.addColorStop(.74,'#ffedff');
    chromeInk.addColorStop(1,colors[1]);
    view.fillStyle=chromeInk;
    view.shadowColor=colors[0];
    view.shadowBlur=10*(1-p);
    view.strokeStyle='#f6e6ff90';
    view.lineWidth=.85;
    view.strokeText(field.text,0,0);
  } else view.fillStyle='#f6ebf5';
  view.fillText(field.text,0,0);
  view.restore();
}
function ease(t,start,end) {
  const n=Math.max(0,Math.min(1,(t-start)/(end-start)));
  return n*n*(3-2*n);
}
window.ready=art.decode().then(()=>{
  if(Math.abs(art.width/art.height-.8)>.018) throw Error('Artwork must be 4:5');
  clean.drawImage(art,0,0,720,900);
  if(!config.reference) fitted=fitCopy();
  if(config.custom) return;
  const letters=chrome.getContext('2d');
  letters.drawImage(art,0,0,720,900);
  const ink=letters.getImageData(0,0,720,900);
  for(let row=0;row<900;row++){
    for(let col=0;col<720;col++){
      const i=(row*720+col)*4;
      const inTitle=titleAreas.some(([x,y,w,h])=>col>=x && col<x+w && row>=y && row<y+h);
      ink.data[i+3]=inTitle ? Math.round(255*ease(ink.data[i+1],57,133)) : 0;
    }
  }
  letters.putImageData(ink,0,0);
  if(!config.reference){
    // A soft wash covers the photographed lettering before editable text takes its place.
    const wash=document.createElement('canvas');
    wash.width=720;
    wash.height=900;
    const layer=wash.getContext('2d');
    const gradient=layer.createLinearGradient(0,125,570,715);
    gradient.addColorStop(0,design.tone[0]);
    gradient.addColorStop(1,design.tone[1]);
    layer.fillStyle=gradient;
    const groups=[[design.kicker],titleAreas,details];
    for(const group of groups){
      const x=Math.min(...group.map(row=>row[0]));
      const y=Math.min(...group.map(row=>row[1]));
      const right=Math.max(...group.map(row=>row[0]+row[2]));
      const bottom=Math.max(...group.map(row=>row[1]+row[3]));
      layer.filter='blur(12px)';
      layer.fillRect(x-16,y-15,right-x+32,bottom-y+30);
      layer.filter='none';
      layer.fillRect(x,y,right-x,bottom-y);
    }
    clean.drawImage(wash,0,0);
    return;
  }
  const regions=details;
  for(const [x,y,w,h] of regions) {
    const region=clean.getImageData(x,y,w,h);
    const raw=region.data.slice();
    for(let col=0;col<w;col++){
      const isInk=row=>{
        const i=(row*w+col)*4;
        return raw[i+1]>22 && raw[i+1]>raw[i]*.38;
      };
      for(let row=0;row<h;row++){
        if(!isInk(row)) continue;
        let above=row-1, below=row+1;
        while(above>0 && isInk(above)) above--;
        while(below<h-1 && isInk(below)) below++;
        const mix=(row-above)/Math.max(1,below-above);
        for(let channel=0;channel<3;channel++){
          region.data[(row*w+col)*4+channel]=raw[(above*w+col)*4+channel]*(1-mix)+raw[(below*w+col)*4+channel]*mix;
        }
      }
    }
    clean.putImageData(region,x,y);
  }
});
function flare(x,y,radius,color,alpha) {
  const light=view.createRadialGradient(x,y,0,x,y,radius);
  light.addColorStop(0,color);
  light.addColorStop(1,'#ffdbf700');
  view.globalAlpha=alpha;
  view.fillStyle=light;
  view.fillRect(x-radius,y-radius,radius*2,radius*2);
}
const beat=.48;
window.frame=time=>{
  view.resetTransform();
  view.fillStyle='#130718';
  view.fillRect(0,0,720,900);
  const settle=ease(time,.10,1.84);
  const zoom=1+.32*(1-settle);
  view.translate(360-(focusX-360)*.32*(1-settle),450-(focusY-450)*.35*(1-settle));
  view.rotate(-.07*(1-settle));
  view.scale(zoom,zoom);
  view.translate(-360,-450);
  view.drawImage(base,0,0);

  const lit=ease(time,.2,1.74);
  view.fillStyle='rgba(18,1,24,'+(.91*(1-lit))+')';
  view.fillRect(0,0,720,900);
  if(config.reference){
  for(const [x,y,w,h,start] of titleAreas){
    const landed=ease(time,start+.32,start+.80);
    const entry=ease(time,start,start+.58);
    if(landed<1){
      const shadow=view.createLinearGradient(x,y,x,y+h);
      const alpha=(1-landed)*.95;
      shadow.addColorStop(0,'rgba(25,3,33,0)');
      shadow.addColorStop(.12,'rgba(25,3,33,'+alpha+')');
      shadow.addColorStop(.87,'rgba(25,3,33,'+alpha+')');
      shadow.addColorStop(1,'rgba(25,3,33,0)');
      view.fillStyle=shadow;
      view.fillRect(x,y,w,h);
      if(entry>0){
        const scale=.58+.42*entry;
        view.save();
        view.globalAlpha=ease(time,start,start+.21)*(1-landed);
        view.translate(x+w/2,y+h/2+34*(1-entry));
        view.rotate(-.10*(1-entry));
        view.scale(scale,scale);
        view.drawImage(chrome,x,y,w,h,-w/2,-h/2,w,h);
        view.restore();
      }
    }
  }
  for(const [x,y,w,h,start] of details){
    view.globalAlpha=ease(time,start,start+.44);
    if(design.reflow){
      const index=details.findIndex(row=>row[4]===start);
      view.font='500 '+[25,21,16][index]+'px Arial, sans-serif';
      view.fillStyle='#f4edf5';
      view.textAlign='left';
      view.textBaseline='alphabetic';
      view.fillText(eventCopy[index],168,[551,590,628][index]);
    } else view.drawImage(art,x*art.width/720,y*art.height/900,w*art.width/720,h*art.height/900,x,y,w,h);
  }
  } else {
    [1.44,.56,1.04,2.87,3.44,4.01].forEach((start,index)=>drawCopy(index,time,start));
  }
  view.globalAlpha=1;
  view.globalCompositeOperation='screen';
  const sweep=ease(time,.22,2.36);
  flare(92+567*sweep,676-440*sweep,194,colors[0]+'76',Math.sin(Math.PI*sweep)*.82);
  flare(143+546*sweep,611-410*sweep,104,colors[1]+'65',Math.sin(Math.PI*sweep)*.82);
  const pulse=Math.pow(.5+.5*Math.cos(Math.PI*2*time/beat),4);
  for(let ray=0;ray<12;ray++){
    const drift=time*(.65+ray*.014)+ray*.61;
    const column=(Math.sin(drift)*.5+.5);
    const x=ray<8 ? 90+524*column : 601+85*column;
    const y=ray<8 ? 684+136*((Math.cos(drift*.81)+1)/2) : 136+634*((Math.cos(drift*.71)+1)/2);
    const strength=(.18+.34*pulse)*(.38+.62*Math.pow(Math.sin(drift),2))*ease(time,.18,.92);
    view.save();
    view.translate(x,y);
    view.rotate(-.52+Math.sin(drift)*.34);
    view.globalAlpha=strength;
    const reflection=view.createLinearGradient(-24,0,24,0);
    reflection.addColorStop(0,'#ffffff00');
    reflection.addColorStop(.5,colors[ray%3]);
    reflection.addColorStop(1,'#ffffff00');
    view.fillStyle=reflection;
    view.fillRect(-24,-2.5,48,5);
    view.restore();
  }
  flare(focusX+26*Math.sin(time*.9),focusY+25*Math.cos(time*1.3),100,colors[0]+'51',(.36+.39*pulse)*ease(time,.1,.7));
  view.globalCompositeOperation='source-over';
  view.globalAlpha=1;
};
</script>
