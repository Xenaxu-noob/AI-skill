    /* 14 cuts at 0.9 s instead of 1.2 s: pull each beat's tweens into its new slot.
       Durations and eases are untouched — only the absolute start times move. */
    const SHIFT = 0.3, ENDSHIFT = 13 * SHIFT;
    tl.getChildren(false, true, true).forEach((c) => {
      const tgt = c.targets ? c.targets()[0] : null;
      if (!tgt || !tgt.closest) return;
      const beat = tgt.closest(".beat");
      const id = beat ? beat.id : "";
      if (id === "bend") {
        c.startTime(Math.max(0, c.startTime() - ENDSHIFT));
      } else if (id === "b14") {
        c.startTime(Math.max(0, c.startTime() - ENDSHIFT));
      } else if (id && id.charAt(0) === "b" && !isNaN(+id.slice(1))) {
        const n = +id.slice(1) - 1;
        if (n > 0) c.startTime(Math.max(0, c.startTime() - n * SHIFT));
      }
    });

    window.__timelines["sheet"] = tl;
  </script>
