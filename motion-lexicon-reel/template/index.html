<!doctype html>
<html
  lang="zh-Hans"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Paper","default":"#F1EDE3"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#17140F"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#D2381C"},
    {"id":"font-display","type":"string","label":"Display face","default":"LexiconSerif"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f1ede3;
        --ink: #17140f;
        --accent: #d2381c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15.8"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="sheet"
        data-composition-id="sheet"
        data-composition-src="compositions/sheet.html"
        data-start="0"
        data-duration="15.8"
        data-width="1920"
        data-height="1080"
        data-track-index="0"
        data-track-kind="graphics"
      ></div>
      <audio
        id="bed"
        src="assets/audio/percussion.wav"
        data-start="0"
        data-duration="15.8"
        data-volume="1"
        data-track-index="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
